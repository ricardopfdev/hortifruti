services:
  postgres:
    image: postgres:16-alpine
    container_name: hortifruti-db
    environment:
      POSTGRES_DB: hortifruti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hortifruti
    ports:
      - "5432:5432"
    volumes:
      - hortifruti_pgdata:/var/lib/postgresql/data

volumes:
  hortifruti_pgdata:
