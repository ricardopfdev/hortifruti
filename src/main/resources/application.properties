spring.application.name=hortifruti

# Credenciais: env.local (IntelliJ) ou application-local.properties (perfil local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hortifruti}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.mvc.throw-exception-if-no-handler-found=true
server.error.whitelabel.enabled=false

# Usuários do sistema (altere em produção via env.local)
hortifruti.security.admin.username=${HORTIFRUTI_ADMIN_USERNAME:admin}
hortifruti.security.admin.password=${HORTIFRUTI_ADMIN_PASSWORD:admin123}
hortifruti.security.atendente.username=${HORTIFRUTI_ATENDENTE_USERNAME:atendente}
hortifruti.security.atendente.password=${HORTIFRUTI_ATENDENTE_PASSWORD:atendente123}
