<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | HortiFrúti</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/adminlte/css/adminlte.css}">
</head>
<body class="login-page bg-body-secondary">

<div class="login-box" style="width: 520px; max-width: 95vw;">
    <div class="login-logo">
        <span class="fs-3"><i class="bi bi-flower1 text-success"></i> <b>Horti</b>Frúti</span>
    </div>

    <div class="card">
        <div class="card-body login-card-body">
            <p class="login-box-msg">Cadastre sua família no projeto</p>

            <div th:if="${erro}" class="alert alert-danger py-2" th:text="${erro}"></div>

            <form th:action="@{/cadastro}" th:object="${familia}" method="post">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label">Nome Completo *</label>
                    <input type="text" class="form-control" th:field="*{nomeCompleto}"
                           th:classappend="${#fields.hasErrors('nomeCompleto')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nomeCompleto}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">CPF *</label>
                    <input type="text" class="form-control" th:field="*{cpf}" data-cpf-input
                           maxlength="14" inputmode="numeric" placeholder="000.000.000-00"
                           autocomplete="off"
                           th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{cpf}"></div>
                    <div class="form-text">Informe 11 dígitos. Será usado como usuário de acesso ao sistema.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Telefone *</label>
                    <input type="text" class="form-control" th:field="*{telefone}"
                           th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{telefone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantidade de Moradores *</label>
                    <input type="number" class="form-control" th:field="*{quantidadeMoradores}" min="1"
                           th:classappend="${#fields.hasErrors('quantidadeMoradores')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{quantidadeMoradores}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Endereço (rua/logradouro) *</label>
                    <input type="text" class="form-control" th:field="*{endereco}"
                           th:classappend="${#fields.hasErrors('endereco')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{endereco}"></div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Número *</label>
                        <input type="text" class="form-control" th:field="*{numero}"
                               th:classappend="${#fields.hasErrors('numero')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{numero}"></div>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Bairro *</label>
                        <input type="text" class="form-control" th:field="*{bairro}"
                               th:classappend="${#fields.hasErrors('bairro')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{bairro}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cidade *</label>
                    <input type="text" class="form-control" th:field="*{cidade}"
                           th:classappend="${#fields.hasErrors('cidade')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{cidade}"></div>
                </div>

                <button type="submit" class="btn btn-success w-100 mb-2">
                    <i class="bi bi-arrow-right"></i> Continuar
                </button>
            </form>

            <p class="mt-3 mb-0 text-center text-muted small">
                Já possui cadastro? <a th:href="@{/login}">Entrar</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/cpf-input.js}"></script>

</body>
</html>
