<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${codigo} + ' | HortiFrúti'">Erro | HortiFrúti</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/adminlte/css/adminlte.css}">
</head>
<body class="bg-body-secondary">

<div class="d-flex align-items-center justify-content-center min-vh-100 p-4">
    <div class="card shadow-sm" style="max-width: 520px; width: 100%;">
        <div class="card-body text-center p-5">
            <div class="display-1 fw-bold text-danger mb-2" th:text="${codigo}">500</div>
            <h1 class="h4 mb-3" th:text="${titulo}">Erro</h1>
            <p class="text-muted mb-4" th:text="${mensagem}">Mensagem de erro.</p>
            <p class="small text-secondary mb-4" th:if="${caminho}">
                <i class="bi bi-link-45deg"></i>
                <span th:text="${caminho}">/caminho</span>
            </p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a sec:authorize="isAuthenticated()" th:href="@{/dashboard}" class="btn btn-success">
                    <i class="bi bi-house"></i> Ir ao Dashboard
                </a>
                <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-success">
                    <i class="bi bi-box-arrow-in-right"></i> Fazer Login
                </a>
                <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
                    <i class="bi bi-arrow-left"></i> Voltar
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>
</html>
