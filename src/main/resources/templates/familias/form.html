<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Família</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body class="hold-transition sidebar-mini">

<div class="wrapper">

    <div class="content-wrapper p-4">

        <section class="content-header">
            <h1>Cadastro de Família</h1>
        </section>

        <section class="content">

            <div class="card">
                <div class="card-body">

                    <form th:action="@{/familias/salvar}" th:object="${familia}" method="post">

                        <input type="hidden" th:field="*{id}" />

                        <div class="form-group">
                            <label>Nome Completo</label>
                            <input type="text" class="form-control" th:field="*{nomeCompleto}">
                        </div>

                        <div class="form-group">
                            <label>CPF</label>
                            <input type="text" class="form-control" th:field="*{cpf}">
                        </div>

                        <div class="form-group">
                            <label>Telefone</label>
                            <input type="text" class="form-control" th:field="*{telefone}">
                        </div>

                        <div class="form-group">
                            <label>Endereço</label>
                            <input type="text" class="form-control" th:field="*{endereco}">
                        </div>

                        <div class="form-group">
                            <label>Quantidade de Moradores</label>
                            <input type="number" class="form-control" th:field="*{quantidadeMoradores}">
                        </div>

                        <div class="form-group">
                            <label>Situação</label>
                            <input type="text" class="form-control" th:field="*{situacao}">
                        </div>

                        <button type="submit" class="btn btn-success">
                            Salvar
                        </button>

                        <a href="/familias" class="btn btn-secondary">
                            Voltar
                        </a>

                    </form>

                </div>
            </div>

        </section>

    </div>

</div>

</body>
</html>
