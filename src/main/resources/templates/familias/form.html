<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${familia.id != null} ? 'Editar Família' : 'Nova Família', 'familias', ~{::section})}">
<body>
<section>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/familias/salvar}" th:object="${familia}" method="post">

                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{id}"/>

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Nome Completo *</label>
                        <input type="text" class="form-control" th:field="*{nomeCompleto}"
                               th:classappend="${#fields.hasErrors('nomeCompleto')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{nomeCompleto}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">CPF *</label>
                        <input type="text" class="form-control" th:field="*{cpf}" data-cpf-input
                               maxlength="11" inputmode="numeric" placeholder="00000000000"
                               autocomplete="off"
                               oninput="this.value=this.value.replace(/\D/g,'').slice(0,11)"
                               th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{cpf}"></div>
                        <div class="form-text">Informe 11 dígitos.</div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Telefone *</label>
                        <input type="text" class="form-control" th:field="*{telefone}"
                               th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{telefone}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Quantidade de Moradores *</label>
                        <input type="number" class="form-control" th:field="*{quantidadeMoradores}" min="1"
                               th:classappend="${#fields.hasErrors('quantidadeMoradores')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{quantidadeMoradores}"></div>
                    </div>
                    <div class="col-md-4 mb-3 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" th:field="*{ativa}" id="ativa">
                            <label class="form-check-label" for="ativa">Família ativa (pode receber alimentos)</label>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Endereço (rua/logradouro) *</label>
                        <input type="text" class="form-control" th:field="*{endereco}"
                               th:classappend="${#fields.hasErrors('endereco')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{endereco}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Número *</label>
                        <input type="text" class="form-control" th:field="*{numero}"
                               th:classappend="${#fields.hasErrors('numero')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{numero}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Bairro *</label>
                        <input type="text" class="form-control" th:field="*{bairro}"
                               th:classappend="${#fields.hasErrors('bairro')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{bairro}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cidade *</label>
                        <input type="text" class="form-control" th:field="*{cidade}"
                               th:classappend="${#fields.hasErrors('cidade')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{cidade}"></div>
                    </div>
                </div>

                <div th:if="${familia.id != null}" class="alert alert-info">
                    <small>
                        Status na fila: <strong th:text="${familia.statusFila}"></strong> |
                        Prioridade: <strong th:text="${familia.prioridade}"></strong>
                        <span th:if="${familia.numeroSenha != null}">
                            | Senha da fila: <strong th:text="${T(java.lang.String).format('%03d', familia.numeroSenha)}"></strong>
                        </span>
                    </small>
                </div>

                <div th:if="${usuario != null}" class="alert alert-warning">
                    <h6 class="alert-heading mb-2"><i class="bi bi-key"></i> Acesso ao sistema</h6>
                    <div class="row small">
                        <div class="col-md-4">
                            <strong>Usuário (CPF):</strong>
                            <span th:text="${T(com.hortifruti.validation.CpfUtil).formatar(usuario.username)}"></span>
                        </div>
                        <div class="col-md-4">
                            <strong>Senha de acesso:</strong>
                            <span th:text="${usuario.senhaAcesso}"></span>
                        </div>
                        <div class="col-md-4" th:if="${familia.numeroSenha != null}">
                            <strong>Senha de retirada:</strong>
                            <span th:text="${T(java.lang.String).format('%03d', familia.numeroSenha)}"></span>
                        </div>
                    </div>
                </div>

                <div th:if="${usuario == null and familia.id == null}" class="alert alert-info small mb-0">
                    <i class="bi bi-info-circle"></i>
                    Ao salvar, serão geradas automaticamente a senha de acesso (5 caracteres: 1 letra e 4 números)
                    e a senha de retirada na fila.
                </div>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-save"></i> Salvar
                </button>
                <a th:href="@{/familias}" class="btn btn-secondary">Cancelar</a>

            </form>
        </div>
    </div>
    <th:block th:replace="~{fragments/cpf-input :: script}"></th:block>
</section>
</body>
</html>
