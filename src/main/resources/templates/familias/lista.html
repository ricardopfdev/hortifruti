<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Famílias', 'familias', ~{::section})}">
<body>
<section>
    <div th:if="${senhaAcessoGerada}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <h6 class="alert-heading"><i class="bi bi-key"></i> Senhas geradas para a família</h6>
        <p class="mb-1"><strong>Usuário (CPF):</strong> <span th:text="${cpfFormatado}"></span></p>
        <p class="mb-1"><strong>Senha de acesso (login):</strong> <span th:text="${senhaAcessoGerada}"></span></p>
        <p class="mb-0" th:if="${senhaRetirada != null}">
            <strong>Senha de retirada (fila):</strong>
            <span th:text="${T(java.lang.String).format('%03d', senhaRetirada)}"></span>
        </p>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <a th:href="@{/familias/novo}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i> Nova Família
        </a>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/familias}" method="get" class="row g-3 align-items-end">
                <input type="hidden" name="page" value="0">
                <div class="col-md-4">
                    <label class="form-label">Buscar</label>
                    <input type="text" class="form-control" name="busca" th:value="${filtro.busca}"
                           placeholder="Nome ou CPF">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status na fila</label>
                    <select class="form-select" name="statusFila">
                        <option value="" th:selected="${filtro.statusFila == null or filtro.statusFila == ''}">Todos</option>
                        <option value="NA_FILA" th:selected="${filtro.statusFila == 'NA_FILA'}">Na fila</option>
                        <option value="ATENDIDO" th:selected="${filtro.statusFila == 'ATENDIDO'}">Atendido</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Ativa</label>
                    <select class="form-select" name="ativa">
                        <option value="" th:selected="${filtro.ativa == null or filtro.ativa == ''}">Todas</option>
                        <option value="true" th:selected="${filtro.ativa == 'true'}">Sim</option>
                        <option value="false" th:selected="${filtro.ativa == 'false'}">Não</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <label class="form-label">Por pág.</label>
                    <select class="form-select" name="size">
                        <option value="10" th:selected="${filtro.size == 10}">10</option>
                        <option value="20" th:selected="${filtro.size == 20}">20</option>
                        <option value="50" th:selected="${filtro.size == 50}">50</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="bi bi-search"></i> Filtrar
                    </button>
                    <a th:href="@{/familias}" class="btn btn-outline-secondary" title="Limpar filtros">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/paginacao :: info(${pagina})}"></div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Moradores</th>
                    <th>Ativa</th>
                    <th>Status Fila</th>
                    <th>Senha</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f : ${familias}">
                    <td th:text="${f.id}"></td>
                    <td th:text="${f.nomeCompleto}"></td>
                    <td th:text="${f.cpf}"></td>
                    <td th:text="${f.quantidadeMoradores}"></td>
                    <td>
                        <span th:if="${f.ativa}" class="badge text-bg-success">Sim</span>
                        <span th:unless="${f.ativa}" class="badge text-bg-secondary">Não</span>
                    </td>
                    <td>
                        <span th:if="${f.statusFila == 'NA_FILA'}" class="badge text-bg-warning">Na fila</span>
                        <span th:if="${f.statusFila == 'ATENDIDO'}" class="badge text-bg-success">Atendido</span>
                    </td>
                    <td>
                        <span th:if="${f.numeroSenha != null}"
                              class="badge text-bg-primary"
                              th:text="${T(java.lang.String).format('%03d', f.numeroSenha)}"></span>
                        <span th:if="${f.numeroSenha == null}" class="text-muted">—</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{'/familias/editar/' + ${f.id}}"
                           class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{'/familias/deletar/' + ${f.id}}" method="post" class="d-inline"
                              onsubmit="return confirm('Deseja excluir esta família? Entregas e acesso ao sistema também serão removidos.');">
                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                        <form th:if="${f.statusFila == 'NA_FILA' and f.numeroSenha != null}"
                              th:action="@{'/familias/entregar/' + ${f.id}}" method="post" class="d-inline">
                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-success" title="Dar baixa">
                                <i class="bi bi-check-lg"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(familias)}">
                    <td colspan="8" class="text-center text-muted py-4">
                        Nenhuma família encontrada.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer">
            <div th:replace="~{fragments/paginacao :: familias(${pagina}, ${filtro})}"></div>
        </div>
    </div>
</section>
</body>
</html>
