<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Baixa por Senha', 'baixa', ~{::section})}">
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title mb-0">
                        <i class="bi bi-ticket-perforated"></i> Confirmar Entrega por Senha
                    </h3>
                </div>
                <div class="card-body">
                    <p class="text-muted">
                        Informe a senha apresentada pela família. O sistema registrará a entrega
                        e dará baixa na fila automaticamente.
                    </p>
                    <form th:action="@{/fila/baixa}" method="post">
                        <div class="mb-3">
                            <label class="form-label fs-5">Número da Senha</label>
                            <input type="number" name="senha" class="form-control form-control-lg text-center"
                                   min="1" required autofocus placeholder="Ex: 1">
                        </div>
                        <button type="submit" class="btn btn-success btn-lg w-100">
                            <i class="bi bi-check2-circle"></i> Confirmar Entrega
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
