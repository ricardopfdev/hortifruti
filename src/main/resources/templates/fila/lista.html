<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Fila de Atendimento</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body class="hold-transition sidebar-mini">

<div class="content-wrapper p-4">

    <!-- HEADER -->
    <h1 class="mb-4">Painel da Fila de Atendimento</h1>

    <!-- KPI -->
    <div class="row mb-4">

        <div class="col-lg-4 col-6">
            <div class="small-box bg-warning">
                <div class="inner">
                    <h3 th:text="${totalFila}">0</h3>
                    <p>Famílias na Fila</p>
                </div>
            </div>
        </div>

        <div class="col-lg-4 col-6">
            <div class="small-box bg-info">
                <div class="inner">
                    <h3 th:text="${totalFila}">0</h3>
                    <p>Aguardando Atendimento</p>
                </div>
            </div>
        </div>

        <div class="col-lg-4 col-6">
            <div class="small-box bg-success">
                <div class="inner">
                    <h3>OK</h3>
                    <p>Sistema Ativo</p>
                </div>
            </div>
        </div>

    </div>

    <!-- LISTA VISUAL -->
    <div class="row">

        <div class="col-md-4 mb-3" th:each="f : ${familias}">

            <div class="card">

                <div class="card-header bg-primary text-white">
                    <strong th:text="${f.nomeCompleto}"></strong>
                </div>

                <div class="card-body">

                    <p><b>CPF:</b> <span th:text="${f.cpf}"></span></p>
                    <p><b>Prioridade:</b> <span th:text="${f.prioridade}"></span></p>

                    <p>
                        <span class="badge badge-warning"
                              th:if="${f.statusFila == 'AGUARDANDO'}">
                            Aguardando
                        </span>

                        <span class="badge badge-success"
                              th:if="${f.statusFila == 'ATENDIDA'}">
                            Atendida
                        </span>
                    </p>

                    <a class="btn btn-success btn-sm"
                       th:href="@{'/fila/atender/' + ${f.id}}">
                        Atender
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
