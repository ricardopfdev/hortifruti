<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Senhas | HortiFrúti</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/adminlte/css/adminlte.css}">
    <style>
        body { background: #1a1a2e; color: #fff; }
        .senha-atual { font-size: 8rem; font-weight: 800; letter-spacing: 0.1em; }
        .senha-proxima { font-size: 2.5rem; font-weight: 600; }
        .painel-card { background: #16213e; border-radius: 1rem; }
    </style>
    <meta http-equiv="refresh" content="15">
</head>
<body class="p-4">

<div class="text-center mb-4">
    <h1 class="display-5"><i class="bi bi-flower1"></i> HortiFrúti — Painel de Senhas</h1>
    <p class="text-secondary">Atualização automática a cada 15 segundos</p>
</div>

<div class="row justify-content-center mb-5" th:if="${!#lists.isEmpty(familias)}">
    <div class="col-lg-6">
        <div class="painel-card p-5 text-center">
            <p class="text-uppercase text-secondary mb-2">Senha em atendimento</p>
            <div class="senha-atual text-warning"
                 th:text="${T(String).format('%03d', familias[0].numeroSenha)}">001</div>
            <p class="fs-4 mt-3" th:text="${familias[0].nomeCompleto}">Nome da Família</p>
        </div>
    </div>
</div>

<div class="row justify-content-center" th:if="${#lists.size(familias) > 1}">
    <div class="col-lg-8">
        <h3 class="text-center mb-3">Próximas senhas</h3>
        <div class="d-flex flex-wrap justify-content-center gap-4">
            <div th:each="f, stat : ${familias}" th:if="${stat.index > 0}" class="text-center painel-card px-4 py-3">
                <div class="senha-proxima text-info"
                     th:text="${T(String).format('%03d', f.numeroSenha)}">002</div>
                <small th:text="${f.nomeCompleto}"></small>
            </div>
        </div>
    </div>
</div>

<div class="text-center mt-5" th:if="${#lists.isEmpty(familias)}">
    <div class="painel-card p-5 d-inline-block">
        <i class="bi bi-hourglass display-1 text-secondary"></i>
        <p class="fs-3 mt-3">Aguardando geração de senhas...</p>
    </div>
</div>

</body>
</html>
