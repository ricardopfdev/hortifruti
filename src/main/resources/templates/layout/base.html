<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>HortiFruti</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- AdminLTE -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">

    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body class="hold-transition sidebar-mini">

<div class="wrapper">

    <!-- ========================= -->
    <!-- NAVBAR SUPERIOR -->
    <!-- ========================= -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">

        <ul class="navbar-nav">

            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button">
                    <i class="fas fa-bars"></i>
                </a>
            </li>

            <li class="nav-item d-none d-sm-inline-block">
                <span class="nav-link font-weight-bold">
                    Sistema HortiFruti
                </span>
            </li>

        </ul>

    </nav>

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->
    <aside class="main-sidebar sidebar-dark-success elevation-4">

        <a th:href="@{/dashboard}" class="brand-link text-center">

            <i class="fas fa-leaf mr-2"></i>

            <span class="brand-text font-weight-light">
                HortiFruti
            </span>

        </a>

        <div class="sidebar">

            <nav class="mt-3">

                <ul class="nav nav-pills nav-sidebar flex-column"
                    data-widget="treeview"
                    role="menu">

                    <!-- DASHBOARD -->
                    <li class="nav-item">
                        <a th:href="@{/dashboard}" class="nav-link">

                            <i class="nav-icon fas fa-tachometer-alt"></i>

                            <p>Dashboard</p>

                        </a>
                    </li>

                    <!-- FAMÍLIAS -->
                    <li class="nav-item">
                        <a th:href="@{/familias}" class="nav-link">

                            <i class="nav-icon fas fa-users"></i>

                            <p>Famílias</p>

                        </a>
                    </li>

                    <!-- FILA -->
                    <li class="nav-item">
                        <a th:href="@{/fila}" class="nav-link">

                            <i class="nav-icon fas fa-list-ol"></i>

                            <p>Fila de Atendimento</p>

                        </a>
                    </li>

                    <!-- ENTREGAS -->
                    <li class="nav-item">
                        <a href="#" class="nav-link disabled">

                            <i class="nav-icon fas fa-box"></i>

                            <p>Entregas</p>

                        </a>
                    </li>

                    <!-- RELATÓRIOS -->
                    <li class="nav-item">
                        <a href="#" class="nav-link disabled">

                            <i class="nav-icon fas fa-chart-bar"></i>

                            <p>Relatórios</p>

                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </aside>

    <!-- ========================= -->
    <!-- CONTEÚDO DAS PÁGINAS -->
    <!-- ========================= -->
    <div class="content-wrapper">

        <div class="content pt-3">

            <div class="container-fluid">

                <section th:fragment="layout">
                    <!-- Conteúdo carregado pelo Thymeleaf -->
                </section>

            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->
    <footer class="main-footer text-center">

        <strong>
            HortiFruti Sistema
        </strong>

        <br>

        Controle de Famílias e Distribuição de Alimentos

    </footer>

</div>

<!-- ========================= -->
<!-- SCRIPTS -->
<!-- ========================= -->

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

</body>
</html>
