<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HortiFrúti</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/adminlte/css/adminlte.css}">
</head>
<body class="login-page bg-body-secondary">

<div class="login-box">
    <div class="login-logo">
        <span class="fs-3"><i class="bi bi-flower1 text-success"></i> <b>Horti</b>Frúti</span>
    </div>

    <div class="card">
        <div class="card-body login-card-body">
            <p class="login-box-msg">Entre para acessar o sistema</p>

            <div th:if="${erro}" class="alert alert-danger py-2" th:text="${erro}"></div>
            <div th:if="${sucesso}" class="alert alert-success py-2" th:text="${sucesso}"></div>

            <form th:action="@{/login}" method="post">
                <div class="input-group mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Usuário"
                           required autofocus autocomplete="username">
                    <div class="input-group-text">
                        <span class="bi bi-person"></span>
                    </div>
                </div>
                <div class="input-group mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Senha"
                           required autocomplete="current-password">
                    <div class="input-group-text">
                        <span class="bi bi-lock"></span>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Entrar
                        </button>
                    </div>
                </div>
            </form>

            <p class="mt-3 mb-0 text-center text-muted small">
                <a th:href="@{/fila/painel}" target="_blank">Painel de senhas (público)</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>
</html>
