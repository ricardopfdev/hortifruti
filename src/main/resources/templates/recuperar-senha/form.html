<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | HortiFrúti</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/adminlte/css/adminlte.css}">
</head>
<body class="login-page bg-body-secondary">

<div class="login-box">
    <div class="login-logo">
        <span class="fs-3"><i class="bi bi-flower1 text-success"></i> <b>Horti</b>Frúti</span>
    </div>

    <div class="card">
        <div class="card-body login-card-body">
            <p class="login-box-msg">Recuperar senha de acesso</p>

            <div class="alert alert-info py-2 small">
                Informe o CPF e o telefone do cadastro. Uma nova senha será gerada na tela.
            </div>

            <div th:if="${erro}" class="alert alert-danger py-2" th:text="${erro}"></div>

            <form th:action="@{/recuperar-senha}" method="post">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="input-group mb-3">
                    <input type="text" name="cpf" class="form-control" placeholder="CPF"
                           th:value="${cpf}" required autofocus>
                    <div class="input-group-text"><span class="bi bi-person-vcard"></span></div>
                </div>
                <div class="input-group mb-3">
                    <input type="text" name="telefone" class="form-control" placeholder="Telefone"
                           th:value="${telefone}" required>
                    <div class="input-group-text"><span class="bi bi-telephone"></span></div>
                </div>
                <button type="submit" class="btn btn-success w-100 mb-2">
                    <i class="bi bi-key"></i> Recuperar senha
                </button>
            </form>

            <a th:href="@{/login}" class="btn btn-outline-secondary w-100">
                <i class="bi bi-arrow-left"></i> Voltar ao login
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>
</html>
