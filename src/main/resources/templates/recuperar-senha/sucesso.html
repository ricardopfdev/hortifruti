<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha recuperada | HortiFrúti</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/adminlte/css/adminlte.css}">
</head>
<body class="login-page bg-body-secondary">

<div class="login-box" style="width: 480px; max-width: 95vw;">
    <div class="login-logo">
        <span class="fs-3"><i class="bi bi-flower1 text-success"></i> <b>Horti</b>Frúti</span>
    </div>

    <div class="card">
        <div class="card-body login-card-body">
            <div class="alert alert-success py-2">
                <i class="bi bi-check-circle"></i> Nova senha gerada com sucesso!
            </div>

            <table class="table table-sm table-bordered mb-3">
                <tbody>
                <tr>
                    <th class="bg-light">Usuário (CPF)</th>
                    <td th:text="${cpfFormatado}"></td>
                </tr>
                <tr class="table-warning">
                    <th class="bg-light">Nova senha de acesso</th>
                    <td><strong class="fs-5" th:text="${senhaAcesso}"></strong></td>
                </tr>
                <tr th:if="${senhaRetirada != null}">
                    <th class="bg-light">Senha de retirada (fila)</th>
                    <td><strong th:text="${T(java.lang.String).format('%03d', senhaRetirada)}"></strong></td>
                </tr>
                </tbody>
            </table>

            <a th:href="@{/login}" class="btn btn-success w-100">
                <i class="bi bi-box-arrow-in-right"></i> Ir para o login
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>
</html>
